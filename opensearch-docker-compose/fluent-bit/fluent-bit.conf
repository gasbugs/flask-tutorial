[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

[INPUT]
    Name              tail
    Tag               syslog.*
    Path              /var/log/syslog
    Parser            syslog-ubuntu
    DB                /fluent-bit/db/syslog.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name    record_modifier
    Match   docker.*
    Record  log_source docker
    Record  collector_host ${HOSTNAME}

[FILTER]
    Name    record_modifier
    Match   syslog.*
    Record  log_source syslog
    Record  collector_host ${HOSTNAME}

[OUTPUT]
    Name              opensearch
    Match             docker.*
    Host              opensearch-node1
    Port              9200
    HTTP_User         admin
    HTTP_Passwd       ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    tls               On
    tls.verify        Off
    Logstash_Format   On
    Logstash_Prefix   docker-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name On
    Include_Tag_Key   On
    Tag_Key           flb_tag

[OUTPUT]
    Name              opensearch
    Match             syslog.*
    Host              opensearch-node1
    Port              9200
    HTTP_User         admin
    HTTP_Passwd       ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    tls               On
    tls.verify        Off
    Logstash_Format   On
    Logstash_Prefix   syslog-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name On
    Include_Tag_Key   On
    Tag_Key           flb_tag
